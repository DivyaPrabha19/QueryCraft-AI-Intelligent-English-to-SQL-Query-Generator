<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueryCraft AI // REGISTER</title>
  
  <link rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}">
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('qc_theme');
        if (savedTheme === 'bright') {
          document.documentElement.classList.add('theme-bright');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="cyan-theme">
  <!-- Scanline Overlay Effect -->
  <div class="scanlines"></div>

  <!-- Theme Toggle in top-right -->
  <div style="position: absolute; top: 20px; right: 20px; z-index: 1000;">
    <button id="btn-theme-toggle" class="btn-cyber btn-theme-toggle" title="Switch Theme">
      <span id="theme-toggle-icon">☀️</span>
      <span id="theme-toggle-text">High Visibility Mode</span>
    </button>
  </div>

  <div class="auth-container">
    <div class="cyber-card auth-card">
      <div class="auth-header">
        <div class="auth-logo">Query<span>Craft</span> AI</div>
        <div class="auth-subtitle">English to SQL Neural Interpreter</div>
      </div>

      <!-- Register / Sign Up Form -->
      <form class="auth-form active pink-theme" id="form-signup">
        <div class="cyber-input-wrapper">
          <label for="signup-username">Codename (Username)</label>
          <input type="text" id="signup-username" class="cyber-input" placeholder="Trinity" required autocomplete="username">
          <span class="cyber-input-icon">
            <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </span>
        </div>

        <div class="cyber-input-wrapper">
          <label for="signup-email">User Identity (Email)</label>
          <input type="email" id="signup-email" class="cyber-input" placeholder="trinity@matrix.com" required autocomplete="email">
          <span class="cyber-input-icon">
            <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </span>
        </div>

        <div class="cyber-input-wrapper">
          <label for="signup-password">Access Cipher (Password)</label>
          <input type="password" id="signup-password" class="cyber-input" placeholder="••••••••" required autocomplete="new-password">
          <span class="cyber-input-icon">
            <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
          </span>
        </div>

        <div class="cyber-input-wrapper">
          <label for="signup-confirm">Verify Cipher</label>
          <input type="password" id="signup-confirm" class="cyber-input" placeholder="••••••••" required autocomplete="new-password">
          <span class="cyber-input-icon">
            <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
          </span>
        </div>

        <button type="submit" class="btn-cyber pink" style="width: 100%; margin-top: 10px;">Initialize Profile</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/config.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
